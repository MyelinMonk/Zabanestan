<style>
:root {
  /* Layout: one reading column, like a manuscript page, with tools pinned to its edges.
     Word states borrow from illumination: lapis for unknown words, gold for words being learned. */
  --paper: #f2f3f0;
  --surface: #ffffff;
  --sunk: #e9ebe7;
  --ink: #1b2131;
  --muted: #5d6578;
  --line: #d8dce3;
  --lapis: #27449f;
  --lapis-soft: rgba(39, 68, 159, .09);
  --on-lapis: #ffffff;
  --gold: #a87508;
  --hl-new: rgba(52, 96, 222, .15);
  --hl-l1: rgba(236, 170, 18, .44);
  --hl-l2: rgba(236, 170, 18, .25);
  --hl-l3: rgba(236, 170, 18, .12);
  --ok: #2c7548;
  --warn: #9a5b00;
  --bad: #b3261e;
  --shadow: 0 12px 32px rgba(18, 26, 48, .16);
  --font-ui: "IBM Plex Sans", "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mark: "Noto Nastaliq Urdu", "Noto Naskh Arabic", serif;
  --font-read: "Noto Serif", "Noto Naskh Arabic", "Noto Serif Hebrew", "Noto Serif Devanagari", Georgia, "Times New Roman", serif;
  --read-size: 21px;
  --read-lh: 1.95;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f131c;
    --surface: #171d2a;
    --sunk: #121722;
    --ink: #e7e9ef;
    --muted: #9aa2b5;
    --line: #2a3246;
    --lapis: #93a9ff;
    --lapis-soft: rgba(147, 169, 255, .13);
    --on-lapis: #0d1220;
    --gold: #e2b54c;
    --hl-new: rgba(110, 146, 255, .25);
    --hl-l1: rgba(232, 176, 52, .40);
    --hl-l2: rgba(232, 176, 52, .24);
    --hl-l3: rgba(232, 176, 52, .13);
    --ok: #74c793;
    --warn: #efb45c;
    --bad: #ff8d84;
    --shadow: 0 12px 32px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f131c;
  --surface: #171d2a;
  --sunk: #121722;
  --ink: #e7e9ef;
  --muted: #9aa2b5;
  --line: #2a3246;
  --lapis: #93a9ff;
  --lapis-soft: rgba(147, 169, 255, .13);
  --on-lapis: #0d1220;
  --gold: #e2b54c;
  --hl-new: rgba(110, 146, 255, .25);
  --hl-l1: rgba(232, 176, 52, .40);
  --hl-l2: rgba(232, 176, 52, .24);
  --hl-l3: rgba(232, 176, 52, .13);
  --ok: #74c793;
  --warn: #efb45c;
  --bad: #ff8d84;
  --shadow: 0 12px 32px rgba(0, 0, 0, .5);
  color-scheme: dark;
}
:root[data-font="sans"] { --font-read: "Noto Sans", "Noto Sans Arabic", "Noto Sans Hebrew", "Noto Sans Devanagari", system-ui, sans-serif; }
:root[data-font="nastaliq"] { --font-read: "Noto Serif", "Noto Nastaliq Urdu", "Noto Naskh Arabic", "Noto Serif Hebrew", "Noto Serif Devanagari", Georgia, serif; }
:root[data-font="system"] { --font-read: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 15px/1.5 var(--font-ui);
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { text-wrap: balance; }
a { color: var(--lapis); }
:focus-visible { outline: 2px solid var(--lapis); outline-offset: 2px; }
[hidden] { display: none !important; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }
.sm { font-size: 13px; }
.xs { font-size: 11.5px; }
.error { color: var(--bad); margin: 6px 0; min-height: 0; }
.error:empty { display: none; }
.ic { display: inline-grid; place-items: center; width: 20px; height: 20px; flex: none; }
.ic svg { width: 100%; height: 100%; }

/* ---------- top bar & tabs ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 10px;
  padding: 8px 16px;
  background: var(--paper);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 8px; margin-inline-end: auto; text-decoration: none; color: var(--ink); min-width: 0; }
.brand .mark { font-family: var(--font-mark); font-weight: 600; font-size: 25px; line-height: 1.6; color: var(--lapis); transform: translateY(-2px); }
.brand .name { font-weight: 600; font-size: 15px; letter-spacing: .01em; }
.lang-btn {
  display: inline-flex; align-items: center; gap: 6px; min-height: 38px; max-width: 58vw;
  padding: 4px 10px 4px 12px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); cursor: pointer;
}
.lang-btn #langName { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lang-btn .nat { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lang-btn .nat:empty { display: none; }
.sync { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
.sync.ok { background: var(--ok); }
.sync.busy { background: var(--gold); }
.sync.warn { background: var(--bad); }
.sync.local { background: transparent; border: 2px solid var(--muted); }
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: grid; grid-template-columns: repeat(4, 1fr);
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
.tabs a {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 8px 4px 9px; color: var(--muted); text-decoration: none; font-size: 11.5px; font-weight: 500;
}
.tabs a .ic { width: 23px; height: 23px; }
.tabs a[aria-current="page"] { color: var(--lapis); }
.badge {
  position: absolute; top: 3px; left: calc(50% + 7px);
  min-width: 18px; padding: 1px 5px; border-radius: 999px;
  background: var(--lapis); color: var(--on-lapis);
  font-size: 10.5px; font-weight: 600; text-align: center; font-variant-numeric: tabular-nums;
}
main { max-width: 760px; margin: 0 auto; padding: 16px 16px 104px; }
@media (min-width: 900px) {
  .tabs { position: static; display: flex; gap: 2px; background: none; border: 0; padding: 0; margin-inline-end: 8px; }
  .tabs a { flex-direction: row; gap: 7px; font-size: 14px; padding: 7px 11px; border-radius: 9px; }
  .tabs a .ic { width: 19px; height: 19px; }
  .tabs a[aria-current="page"] { background: var(--lapis-soft); }
  .badge { position: static; }
  main { padding-bottom: 48px; }
}
body.reading .topbar, body.reading .tabs { display: none; }
body.reading main { max-width: none; padding: 0; }

/* ---------- controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 40px; padding: 8px 14px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font-weight: 500; cursor: pointer; text-decoration: none; line-height: 1.2;
}
.btn:hover { border-color: color-mix(in srgb, var(--lapis) 40%, var(--line)); }
.btn.primary { background: var(--lapis); border-color: var(--lapis); color: var(--on-lapis); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--lapis); }
.btn.danger { color: var(--bad); }
.btn.danger-fill { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.sm { min-height: 32px; padding: 5px 10px; font-size: 13.5px; border-radius: 8px; }
.btn.sm .ic { width: 17px; height: 17px; }
.btn.big { min-height: 52px; font-size: 17px; width: 100%; border-radius: 14px; }
.btn:disabled { opacity: .5; cursor: default; }
.icon-btn {
  display: inline-grid; place-items: center; width: 40px; height: 40px; flex: none;
  border: 0; border-radius: 10px; background: transparent; color: var(--ink); cursor: pointer;
}
.icon-btn:hover { background: var(--lapis-soft); }
.icon-btn .ic { width: 22px; height: 22px; }
.input {
  width: 100%; min-height: 40px; padding: 8px 11px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--surface);
}
textarea.input { resize: vertical; line-height: 1.5; }
.input.mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; }
.input.preview { font-family: var(--font-read); font-size: 17px; line-height: 1.8; }
.field { display: grid; gap: 5px; margin: 0 0 14px; }
.field.tight { margin-bottom: 10px; }
.field > label { font-weight: 500; font-size: 13.5px; }
.hint { margin: 0; color: var(--muted); font-size: 12.5px; }
.check { display: flex; align-items: flex-start; gap: 10px; margin: 0 0 12px; }
.check input { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--lapis); flex: none; }
.check label { display: grid; gap: 1px; }
input[type="range"] { width: 100%; accent-color: var(--lapis); }
.radios { border: 0; padding: 0; margin: 0 0 14px; display: grid; gap: 6px; }
.radios legend { font-weight: 500; font-size: 13.5px; margin-bottom: 4px; padding: 0; }
.radio { display: flex; gap: 10px; align-items: center; }
.radio input { width: 18px; height: 18px; accent-color: var(--lapis); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
.actions.center { justify-content: center; }
.chip {
  display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 500;
  background: var(--sunk); color: var(--muted); border: 1px solid var(--line);
}
.chip.new { background: var(--hl-new); color: var(--ink); border-color: transparent; }
details.adv summary, .sh-more summary { cursor: pointer; color: var(--lapis); font-weight: 500; font-size: 13.5px; padding: 4px 0; }
details.adv[open] summary { margin-bottom: 10px; }

/* ---------- library ---------- */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 4px 0 6px; }
.tile {
  display: grid; gap: 2px; padding: 14px 14px 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  text-decoration: none; color: var(--ink);
}
.tile .big { font-size: 28px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.tile .lbl { color: var(--muted); font-size: 12.5px; }
.tile.learning { box-shadow: inset 0 -3px 0 var(--hl-l1); }
.tile.due { box-shadow: inset 0 -3px 0 var(--lapis); }
.tile.due:hover { border-color: var(--lapis); }
.today { color: var(--muted); font-size: 13px; margin: 8px 2px 0; }
.notice { margin: 14px 0 0; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-inline-start: 3px solid var(--gold); border-radius: 12px; font-size: 14px; line-height: 1.5; }
.notice p { margin: 0; }
.notice .actions { margin: 10px 0 0; }
.notice a { color: var(--lapis); }

/* ---------- accounts: shared resources ---------- */
a.lesson { text-decoration: none; }
.l-meta.warn { color: var(--bad); }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; margin: 14px 0; font-size: 14.5px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; overflow-wrap: anywhere; }
.r-preview { margin-top: 18px; }
.r-text { font-family: var(--font-read); font-size: 20px; line-height: 1.8; white-space: pre-line; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; margin: 0; }
.r-preview .wrow { cursor: default; }
.r-cmd { padding: 10px 12px; background: var(--sunk); border-radius: 10px; overflow-x: auto; font-size: 13px; }
.sec { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 26px 2px 10px; }
.sec.first { margin-top: 6px; }
.lessons { display: grid; gap: 8px; }
.lesson-wrap { position: relative; }
.lesson {
  display: grid; gap: 4px; width: 100%; text-align: start;
  padding: 14px 52px 14px 16px; border-radius: 14px;
  background: var(--surface); border: 1px solid var(--line); cursor: pointer; color: var(--ink);
}
.lesson:hover { border-color: color-mix(in srgb, var(--lapis) 45%, var(--line)); }
.lesson.sample { padding-inline-end: 16px; margin-bottom: 8px; background: var(--sunk); }
.l-title { font-weight: 600; font-size: 16px; overflow-wrap: anywhere; }
.l-meta { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.l-snip { font-family: var(--font-read); font-size: 18px; color: var(--ink); opacity: .85; }
.l-bar { display: block; height: 4px; border-radius: 2px; background: var(--hl-new); overflow: hidden; margin-top: 4px; }
.l-bar i { display: block; height: 100%; background: var(--gold); border-radius: 2px; }
.l-more { position: absolute; top: 8px; right: 6px; }
.empty { color: var(--muted); padding: 22px 16px; text-align: center; border: 1px dashed var(--line); border-radius: 14px; }

/* ---------- reader ---------- */
.reader { max-width: 44rem; margin: 0 auto; padding: 0 16px 140px; }
.rbar {
  position: sticky; top: 0; z-index: 15;
  display: flex; align-items: center; gap: 6px;
  padding: 6px 0; background: var(--paper);
}
.rtitle { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
.icon-btn.aa { font-family: var(--font-read); font-weight: 600; font-size: 16px; }
.rprog { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
.rprog i { display: block; height: 100%; width: 0; background: var(--gold); transition: width .2s; }
.rtext {
  font-family: var(--font-read); font-size: var(--read-size); line-height: var(--read-lh);
  padding: 22px 2px 10px; overflow-wrap: break-word;
}
.rtext p { margin: 0 0 .55em; text-align: start; }
.rtext p.gap { margin-top: 1.25em; }
.w {
  border-radius: .25em; padding: .04em .07em; margin: 0 -.07em;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: background-color .15s, color .15s;
  box-decoration-break: clone; -webkit-box-decoration-break: clone;
}
.st-new { background: var(--hl-new); }
.st-l1 { background: var(--hl-l1); }
.st-l2 { background: var(--hl-l2); }
.st-l3 { background: var(--hl-l3); }
.rtext.plain .w { background: none; }
.w.ph { text-decoration: underline 2px var(--gold); text-underline-offset: .32em; text-decoration-skip-ink: none; }
.w.sel, .rtext.plain .w.sel { background: var(--lapis); color: var(--on-lapis); }
@media (hover: hover) { .w:hover { box-shadow: 0 0 0 1px var(--lapis); } }
.rfoot {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 14;
  display: flex; align-items: center; justify-content: center; gap: 14px;
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
  background: var(--surface); border-top: 1px solid var(--line);
}
.pginfo { display: grid; justify-items: center; font-size: 12.5px; color: var(--muted); min-width: 120px; font-variant-numeric: tabular-nums; }
.pginfo b { color: var(--ink); font-size: 14px; }
#pg-next { min-width: 132px; }

/* ---------- audio and video texts ---------- */
.player { position: sticky; top: 52px; z-index: 13; display: grid; gap: 6px; padding: 8px 0 6px; background: var(--paper); }
.player video { width: 100%; max-height: 34vh; background: #000; border-radius: 10px; }
.player audio { width: 100%; }
.pl-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.pl-row .btn[aria-pressed="true"] { background: var(--lapis-soft); border-color: var(--lapis); color: var(--lapis); }
.pl-credit { margin-inline-start: auto; }
.relink { display: grid; gap: 8px; padding: 12px; border: 1px dashed var(--line); border-radius: 12px; }
.relink label { font-size: 14px; }
.rtext p[data-cue] { border-inline-start: 3px solid transparent; border-radius: 6px; padding: 2px 8px; margin-inline: -11px; transition: background-color .2s, border-color .2s; }
.rtext p.now { background: var(--lapis-soft); border-inline-start-color: var(--lapis); }
.cue-t {
  font: 500 11.5px/1 var(--font-ui); color: var(--muted); background: var(--surface);
  border: 1px solid var(--line); border-radius: 6px; padding: 4px 5px; margin-inline-end: 8px;
  vertical-align: .25em; cursor: pointer; font-variant-numeric: tabular-nums;
}
.cue-t:hover { color: var(--lapis); border-color: var(--lapis); }

/* ---------- word panel ---------- */
.sheet-wrap { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: flex; justify-content: center; pointer-events: none; }
.sheet {
  pointer-events: auto; width: 100%; max-width: 760px; max-height: min(66vh, 640px); overflow-y: auto;
  background: var(--surface); border: 1px solid var(--line); border-bottom: 0;
  border-radius: 18px 18px 0 0; box-shadow: var(--shadow);
  padding: 6px 16px calc(16px + env(safe-area-inset-bottom));
  overscroll-behavior: contain; animation: sheet-up .16s ease-out;
}
@keyframes sheet-up { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
.grab { width: 38px; height: 4px; border-radius: 2px; background: var(--line); margin: 4px auto 6px; }
.sh-head { display: flex; align-items: center; gap: 6px; }
.sh-word { flex: 1; min-width: 0; font-family: var(--font-read); font-size: 27px; line-height: 1.6; overflow-wrap: anywhere; }
.sh-root { margin: -4px 0 6px; color: var(--muted); font-size: 13.5px; }
.sh-root span { font-family: var(--font-read); color: var(--ink); font-size: 16px; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; padding: 3px; margin: 6px 0 12px; background: var(--sunk); border-radius: 12px; }
.seg button { border: 0; background: transparent; border-radius: 9px; padding: 8px 2px; font-size: 13.5px; font-weight: 500; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .14); }
.seg .s-new[aria-pressed="true"] { box-shadow: inset 0 -3px 0 rgba(52, 96, 222, .75), 0 1px 3px rgba(0, 0, 0, .14); }
.seg .s-learn[aria-pressed="true"] { box-shadow: inset 0 -3px 0 var(--gold), 0 1px 3px rgba(0, 0, 0, .14); }
.seg .s-known[aria-pressed="true"] { box-shadow: inset 0 -3px 0 var(--ok), 0 1px 3px rgba(0, 0, 0, .14); }
.sugg:empty { display: none; }
.sugg { margin: -2px 0 10px; }
.thinking { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }
.ai-card { border: 1px solid var(--line); border-left: 3px solid var(--lapis); border-radius: 10px; padding: 10px 12px; background: var(--lapis-soft); display: grid; gap: 6px; }
.ai-main { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
.ai-m { font-weight: 600; font-size: 16px; }
.ai-r { font-family: var(--font-read); color: var(--muted); font-size: 16px; }
.ai-n { margin: 0; font-size: 13.5px; }
.ai-act { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.sh-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 12px; }
.card-info { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13.5px; }
.card-info .ic { width: 17px; height: 17px; color: var(--gold); }
.sh-more { margin: 0 0 10px; }
.sh-more[open] summary { margin-bottom: 8px; }
.sh-sent { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 4px; }
.sh-sent p { margin: 0 0 4px; font-family: var(--font-read); font-size: 17px; line-height: 1.9; }
.sh-sent mark, .rv-sent mark { background: var(--hl-l1); color: inherit; border-radius: 4px; padding: 0 .1em; }
.tr-out { white-space: pre-wrap; font-size: 14px; color: var(--ink); margin-top: 4px; }
.tr-out:empty { display: none; }
.sh-phrase { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; border-top: 1px solid var(--line); padding-top: 10px; margin-top: 10px; }
.dicts { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; border-top: 1px solid var(--line); padding-top: 10px; margin-top: 10px; }
.dict { font-size: 13.5px; font-weight: 500; text-decoration: none; }
.dict:hover { text-decoration: underline; }
@media (min-width: 1000px) {
  .sheet-wrap { top: 0; left: auto; width: 400px; }
  .sheet { max-height: none; height: 100%; border-radius: 0; border: 0; border-left: 1px solid var(--line); box-shadow: none; animation: none; padding-top: 14px; }
  .grab { display: none; }
  body.sheet-open.reading .reader { margin-right: 400px; margin-left: max(16px, calc((100vw - 400px - 44rem) / 2)); }
}

/* ---------- dialogs ---------- */
.modal-wrap {
  position: fixed; inset: 0; z-index: 60;
  display: flex; align-items: flex-end; justify-content: center;
  background: rgba(8, 12, 22, .45);
}
.modal {
  width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto;
  background: var(--surface); color: var(--ink);
  border-radius: 18px 18px 0 0; box-shadow: var(--shadow);
  padding: 14px 18px calc(18px + env(safe-area-inset-bottom));
  overscroll-behavior: contain;
}
.modal.wide { max-width: 640px; }
@media (min-width: 640px) {
  .modal-wrap { align-items: center; padding: 24px; }
  .modal { border-radius: 16px; padding-bottom: 18px; }
}
.m-head { display: flex; align-items: center; gap: 8px; margin: 0 -6px 8px 0; }
.m-head h2 { flex: 1; margin: 0; font-size: 19px; }
.m-text { margin: 0 0 12px; }
.m-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 14px; }
.sub { font-size: 14px; margin: 20px 0 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.lang-list { display: grid; gap: 6px; }
.lang-row {
  display: flex; align-items: baseline; gap: 10px; width: 100%; padding: 12px 14px; text-align: start;
  border: 1px solid var(--line); border-radius: 12px; background: var(--surface); cursor: pointer;
}
.lang-row.on { border-color: var(--lapis); background: var(--lapis-soft); }
.lang-row .ln { font-weight: 600; }
.lang-row .nat { color: var(--muted); }
.lang-row .cnt { margin-inline-start: auto; color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.cat { display: grid; gap: 4px; margin-top: 12px; }
.cat-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 14px 0 4px; }
.cat-head h3 { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.cat-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 2px; border-bottom: 1px solid var(--line); }
.cat-name { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.cat-name .nat, .opt-lang .nat { color: var(--muted); }
code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; color: var(--muted); }
.progress { height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; margin: 0 0 14px; }
.progress i { display: block; height: 100%; width: 0; background: var(--lapis); transition: width .3s; }
.facts { list-style: none; padding: 0; margin: 0 0 6px; display: grid; gap: 6px; }
.steps { margin: 0 0 6px; padding-left: 20px; display: grid; gap: 6px; }
.facts b { font-variant-numeric: tabular-nums; font-size: 17px; }

/* ---------- toast ---------- */
.toast {
  position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 80;
  transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  display: flex; align-items: center; gap: 10px; max-width: calc(100vw - 32px);
  padding: 9px 10px 9px 16px; border-radius: 12px;
  background: var(--ink); color: var(--paper); box-shadow: var(--shadow); font-size: 14px;
  transition: opacity .18s, transform .18s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast .btn.ghost { color: var(--paper); text-decoration: underline; min-height: 30px; }
body.reading .toast { bottom: calc(80px + env(safe-area-inset-bottom)); }
body.sheet-open .toast, body.modal-open .toast { bottom: auto; top: 64px; }

/* ---------- review ---------- */
.rv-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin: 2px 0 14px; }
.seg2 { display: inline-flex; padding: 3px; gap: 3px; border-radius: 11px; background: var(--sunk); }
.seg2 button { border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; font-weight: 500; font-size: 13.5px; color: var(--muted); cursor: pointer; }
.seg2 button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .14); }
.counts { display: flex; gap: 6px; flex-wrap: wrap; }
.cchip { font-size: 12.5px; color: var(--muted); padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
.cchip b { color: var(--ink); font-variant-numeric: tabular-nums; }
.cchip.c-new { box-shadow: inset 0 -2px 0 rgba(52, 96, 222, .7); }
.cchip.c-learn { box-shadow: inset 0 -2px 0 var(--gold); }
.rv-card {
  display: grid; align-content: center; justify-items: center; gap: 12px;
  min-height: 46vh; padding: 28px 20px; text-align: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: 20px;
}
.rv-tags { display: flex; gap: 6px; min-height: 20px; }
.rv-word { font-family: var(--font-read); font-size: clamp(30px, 8vw, 44px); line-height: 1.55; overflow-wrap: anywhere; }
.rv-sent { margin: 0; max-width: 34em; font-family: var(--font-read); font-size: 18px; line-height: 1.9; color: var(--muted); }
.rv-back { display: grid; gap: 8px; justify-items: center; width: 100%; border-top: 1px solid var(--line); padding-top: 14px; }
.rv-m { font-size: 21px; font-weight: 500; }
.rv-m.big { font-size: clamp(22px, 6vw, 30px); max-width: 26em; }
.rv-r { margin: 0; color: var(--muted); }
.rv-r span { font-family: var(--font-read); color: var(--ink); font-size: 18px; }
.rv-n { margin: 0; font-size: 14.5px; max-width: 34em; }
.rv-o { margin: 0; color: var(--muted); font-size: 12.5px; }
.reveal { margin-top: 14px; }
.grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
.grade {
  display: grid; gap: 1px; justify-items: center; padding: 10px 4px; min-height: 58px;
  border-radius: 13px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600;
}
.grade small { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
.grade.again { box-shadow: inset 0 -3px 0 var(--bad); }
.grade.hard { box-shadow: inset 0 -3px 0 var(--warn); }
.grade.good { box-shadow: inset 0 -3px 0 var(--ok); }
.grade.easy { box-shadow: inset 0 -3px 0 var(--lapis); }
.rv-sub { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; margin-top: 12px; }
.rv-done { text-align: center; padding: 36px 16px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; }
.rv-done-big { font-family: var(--font-read); font-size: 28px; margin: 0 0 6px; }

/* ---------- words ---------- */
.wfilters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: center; }
.wfilters input[type="search"] { grid-column: 1 / -1; }
.wfilters .check { margin: 0; grid-column: 1 / -1; }
.wlist { display: grid; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); overflow: hidden; }
.wlist .empty { border: 0; }
.wrow {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: baseline;
  width: 100%; padding: 11px 14px; text-align: start; border: 0; border-bottom: 1px solid var(--line);
  background: transparent; cursor: pointer;
}
.wrow:last-child { border-bottom: 0; }
.wrow:hover { background: var(--lapis-soft); }
.wf { font-family: var(--font-read); font-size: 19px; overflow-wrap: anywhere; }
.wm { grid-column: 1; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.wm:empty { display: none; }
.wst { grid-column: 2; grid-row: 1; font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.wst.s1 { color: var(--gold); }
.wst.s2 { color: var(--ok); }

/* ---------- options ---------- */
.opt { margin-bottom: 8px; }
.opt-langs { display: grid; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); overflow: hidden; }
.opt-lang { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.opt-lang:last-child { border-bottom: 0; }
.opt-lang > div { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.sync-inline { font-weight: 500; }
.help { padding-left: 18px; display: grid; gap: 6px; color: var(--ink); }

@media (max-width: 400px) {
  .tiles { gap: 6px; }
  .tile { padding: 12px 10px 10px; }
  .tile .big { font-size: 23px; }
  .brand .name { display: none; }
  .row2 { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
.r-title { font-size: 22px; font-weight: 600; line-height: 1.35; margin: 10px 0 6px; overflow-wrap: anywhere; }

/* website copy: the wordmark uses a font cut down to its five letters */
:root { --font-mark: "Khwanish Mark", "Noto Nastaliq Urdu", "Noto Naskh Arabic", serif; }

</style>

/* ---------- state changes ---------- */

/* ---------- your account (the artifact's private db) ---------- */
const Cloud = {

/* ---------- the sync queue ---------- */
const Sync = {

  },
  markDirty(id, delay) { this.dirty.add(id); this.kick(delay); },
  has() { return this.v.size + this.dirty.size + this.texts.size + this.dels.size > 0; },
  kick(delay = 1500) {

  serialize() {

      for (const lid of [...this.texts]) { await uploadText(lid); this.texts.delete(lid); }
      // 2. settings, stats, lesson metadata
      for (const id of [...this.dirty]) {
        this.dirty.delete(id);

        catch (e) { this.dirty.add(id); throw e; }

      // 3. words, grouped by their current shard document
      groups = new Map();
      for (const [id, keys] of this.v) {
        const code = id.split('.')[1];

  if (text == null) return;

  for (let i = 0; i < chunks.length; i++) {
    await withTimeout(Cloud.doc(`lt.${lid}.${i}`).set({ t: 'lt', s: chunks[i] }), 30000, 'upload');

/* ---------- loading ---------- */
async function ensureLangLocal(code) {
  if (S.loaded.has(code)) return;
  S.loaded.add(code);
  const obj = await Local.get('v:' + code);
  if (obj) {
    const m = vmap(code);
    for (const k in obj) { const l = m.get(k), r = obj[k]; if (!l || (r.u || 0) > (l.u || 0)) m.set(k, r); }
  }
}

}

  if (S.cloudLoaded.has(code)) return;
  S.cloudLoaded.add(code);
  try {
    const snap = await withTimeout(Cloud.col.where('vl', '==', code).limit(1000).get(), 25000, 'load words');
    const seen = new Set();
    let changed = false;
    for (const d of snap.docs) {
      Cloud.known.add(d.id);
      const r = mergeRemoteEntries(code, (d.data() || {}).w || {});
      r.seen.forEach(k => seen.add(k));
      changed = changed || r.changed;
    }
    for (const k of vmap(code).keys()) if (!seen.has(k)) Sync.markEntry(code, k);
    Persist.touch(code);

  if (S.texts.has(lid)) return S.texts.get(lid);
  let t = await Local.get('lt:' + lid);
  if (t == null && Cloud.state === 'ready') {
    const m = S.lessons.get(lid);
    const n = (m && m.chunks) || 1;
    const parts = [];
    try {
      for (let i = 0; i < n; i++) {
        const snap = await withTimeout(Cloud.doc(`lt.${lid}.${i}`).get(), 20000, 'load text');
        if (!snap.exists) { parts.length = 0; break; }
        parts.push((snap.data() || {}).s || '');
      }
    } catch (e) { parts.length = 0; console.warn('loading text failed', e); }

}
async function cloudSync() {
  UI.syncStatus();

  if (!ok) { Cloud.state = 'local'; UI.syncStatus(); UI.capsChanged(); return; }
  try {
    const snap = await withTimeout(Cloud.col.where('t', 'in', ['set', 'stats', 'lm']).limit(1000).get(), 25000, 'load');
    let rs = null, rst = null;
    const rl = new Map();
    for (const d of snap.docs) {
      const x = d.data() || {};
      Cloud.known.add(d.id);
      if (x.t === 'set') rs = x;
      else if (x.t === 'stats') rst = x;
      else if (x.t === 'lm' && x.id) rl.set(x.id, x);
    }
    // settings: a device's first sync adopts the account's settings
    if (rs && rs.s && (!S.meta.cloudSeen || (rs.u || 0) > (S.settings.u || 0))) {
      const cur = S.settings.cur;
      S.settings = fixSettings(rs.s);
      if (S.meta.cloudSeen && cur && S.settings.langs.some(l => l.code === cur)) S.settings.cur = cur;
      resetLangCaches();
    } else if (!rs || (S.settings.u || 0) > (rs.u || 0)) Sync.dirty.add('settings');
    // stats: keep the larger count for each day
    if (rst && rst.days) {
      for (const [d, v] of Object.entries(rst.days)) {
        const l = S.stats.days[d] || (S.stats.days[d] = {});
        for (const f in v) l[f] = Math.max(l[f] || 0, v[f] || 0);
      }
    }
    if (!rst || (S.stats.u || 0) > (rst.u || 0)) Sync.dirty.add('stats');
    // lessons
    for (const [id, x] of rl) {
      const { t, ...rm } = x;
      const lm = S.lessons.get(id);
      if (!lm || (rm.u || 0) > (lm.u || 0)) {
        S.lessons.set(id, rm);
        if (rm.del) { S.texts.delete(id); Local.del('lt:' + id); }
      } else if ((lm.u || 0) > (rm.u || 0)) Sync.dirty.add('lm.' + id);
    }
    for (const [id, lm] of S.lessons) {
      if (!rl.has(id)) { Sync.dirty.add('lm.' + id); if (!lm.del) Sync.texts.add(id); }
    }
    Cloud.state = 'ready';
    S.meta.cloudSeen = true;
    Persist.touch();
    await Promise.all([...S.loaded].map(c => loadLangCloud(c)));
    UI.refresh();
    Sync.kick(300);
  } catch (e) {
    console.warn('connecting to your account failed', e);
    const code = e && e.code;
    Cloud.state = (code === 'not_granted' || code === 'revoked' || code === 'capability_disabled' || code === 'capability_removed') ? 'local' : 'offline';
    UI.syncStatus();
    if (Cloud.state === 'local') UI.capsChanged(); // the library and options explain browser-only saving

  }
}

/* ---------- lessons ---------- */

    words: countWords(text, lang), chunks: chunkText(text, 180000).length,
    page: 0, created: Date.now(), opened: 0, src: src || '',

  const parts = [];
  let cur = [], cw = 0;
  const tok = tokenizer(lang);
  for (const line of text.split('\n')) {
    const w = tok(line).filter(t => t.w).length;
    if (cw + w > target && cw > target * 0.5) { parts.push(cur.join('\n')); cur = []; cw = 0; }
    cur.push(line); cw += w;
  }
  if (cur.length) parts.push(cur.join('\n'));
  return parts.map(p => p.trim()).filter(Boolean);
}

/* ---------- recordings for audio/video texts (kept on this device) ---------- */

/* ---------- backup ---------- */
async function buildBackup() {
  const codes = new Set([...S.settings.langs.map(l => l.code), ...S.vocab.keys()]);
  for (const c of codes) await ensureLang(c);

  for (const m of S.lessons.values()) {
    if (m.del) continue;
    lessons.push({ ...m, text: await getText(m.id) });
  }

  for (const c of codes) {
    const o = {};

async function restoreBackup(json) {
  let b;
  try { b = JSON.parse(json); } catch { throw new Error('That file isn’t valid JSON.'); }
  if (!b || b.app !== 'khwanish') throw new Error('That file isn’t a Khwānish backup.');
  const have = new Set(S.settings.langs.map(l => l.code));
  const langs = [...S.settings.langs];
  for (const l of (b.settings && b.settings.langs) || []) if (l && l.code && !have.has(l.code)) langs.push(fixLang(l));
  setSettings({ langs });
  let nl = 0, nw = 0;
  for (const m of b.lessons || []) {
    if (!m || !m.id) continue;
    const cur = S.lessons.get(m.id);
    if (cur && (cur.u || 0) >= (m.u || 0)) continue;
    const { text, ...meta } = m;
    if (text != null) { S.texts.set(meta.id, text); await Local.set('lt:' + meta.id, text); Sync.texts.add(meta.id); }
    S.lessons.set(meta.id, meta);
    Sync.markDirty('lm.' + meta.id);
    nl++;
  }
  for (const [c, o] of Object.entries(b.vocab || {})) {
    await ensureLang(c);
    const m = vmap(c);
    for (const [k, a] of Object.entries(o)) {
      const r = decE(a);
      if (!r) continue;
      const l = m.get(k);
      if (!l || (r.u || 0) > (l.u || 0)) { m.set(k, r); Sync.markEntry(c, k); nw++; }
    }
    Persist.touch(c);
  }
  if (b.stats && b.stats.days) {
    for (const [d, v] of Object.entries(b.stats.days)) {
      const l = S.stats.days[d] || (S.stats.days[d] = {});
      for (const f in v) l[f] = Math.max(l[f] || 0, v[f] || 0);
    }
    Sync.markDirty('stats');
  }
  Persist.touch();
  return { lessons: nl, words: nw };
}

/* ---------- changing a language's matching rules ---------- */
async function rekeyLang(code) {
  await ensureLang(code);
  const lang = L(code);
  if (!lang) return 0;
  const kf = keyFn(lang);
  const m = vmap(code);
  const now = Date.now();
  let moved = 0;
  for (const [k, e] of [...m]) {
    if (e.d) continue;
    const nk = e.p ? k.split(' ').map(kf).filter(Boolean).join(' ') : kf(k);
    if (!nk || nk === k) continue;
    const tgt = m.get(nk);
    if (!tgt || tgt.d || (e.u || 0) > (tgt.u || 0)) { m.set(nk, { ...e, u: now }); Sync.markEntry(code, nk); }
    m.set(k, { d: 1, u: now });
    Sync.markEntry(code, k);
    moved++;
  }
  Persist.touch(code);
  return moved;
}

  const scale = clamp(1500 / vp1.width, 0.5, 3);
  const vp = page.getViewport({ scale });

  canvas.width = Math.round(vp.width); canvas.height = Math.round(vp.height);
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);

    const ctx = canvas.getContext('2d');

const SQLJS_CDN = 'https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-asm-memory-growth.js';

const SQLJS_URLS = SITE ? [SITE.lib + 'sql.js/sql-asm-memory-growth.js', SQLJS_CDN] : [SQLJS_CDN];
let sqlPromise = null;
function loadSqlJs() {
  if (sqlPromise) return sqlPromise;
  sqlPromise = (async () => {
    let fetched = false;
    for (const url of SQLJS_URLS) {
      if (typeof window.initSqlJs === 'function') break;
      try { await loadScript(url); fetched = true; } catch { /* try the next copy */ }

    if (typeof window.initSqlJs !== 'function') {

/* ---------- a minimal zip writer (stored, no compression) ---------- */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;
})();
function crc32(u8) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function zipStore(files) {
  const d = new Date();
  const time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  const parts = [], central = [];
  let offset = 0;
  for (const f of files) {
    const name = enc.encode(f.name), crc = crc32(f.data), size = f.data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, time, true); lh.setUint16(12, date, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, size, true); lh.setUint32(22, size, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), name, f.data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
    ch.setUint16(10, 0, true); ch.setUint16(12, time, true); ch.setUint16(14, date, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, size, true); ch.setUint32(24, size, true); ch.setUint16(28, name.length, true);
    ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + size;
  }
  const cdSize = central.reduce((n, p) => n + p.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: 'application/zip' });
}

// rows: [code, key, entry]; deckFor(code) → deck name; reverse: include meaning→word cards
async function buildApkg(rows, deckFor, reverse) {
  const SQL = await loadSqlJs();
  const db = new SQL.Database();
  try {
    db.run(ANKI_SCHEMA);
    const now = Date.now(), nowS = Math.floor(now / 1000);
    const today0 = dayStart(now);
    const decks = { 1: ankiDeck(1, 'Default', nowS) };
    const deckIds = new Map();
    const deckOf = code => {
      const name = deckFor(code);
      if (!deckIds.has(name)) {
        const id = ankiId('deck:', name);
        deckIds.set(name, id);
        decks[id] = ankiDeck(id, name, nowS);
        // parent decks must exist too
        const parts = name.split('::');
        for (let i = 1; i < parts.length; i++) {
          const pn = parts.slice(0, i).join('::');
          const pid = ankiId('deck:', pn);
          if (!decks[pid]) decks[pid] = ankiDeck(pid, pn, nowS);
        }
      }
      return deckIds.get(name);
    };
    const usedIds = new Set();
    const uniq = id => { while (usedIds.has(id)) id++; usedIds.add(id); return id; };
    const ret = S.settings.retention;
    let newPos = 0, nCards = 0, nReviews = 0;
    const sorted = [...rows].sort((a, b) => (a[2].a || a[2].u || 0) - (b[2].a || b[2].u || 0));
    db.run('BEGIN');
    const insNote = db.prepare('INSERT INTO notes VALUES (?,?,?,?,?,?,?,?,?,?,?)');
    const insCard = db.prepare('INSERT INTO cards VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)');
    const insRev = db.prepare('INSERT INTO revlog VALUES (?,?,?,?,?,?,?,?,?)');
    for (const [code, k, e] of sorted) {
      const lang = langOrStub(code);
      const did = deckOf(code);
      const form = e.f || k;
      const flds = [escHtml(form), escHtml(e.m || ''), escHtml(e.r || ''), escHtml(e.n || ''), e.x ? markHtml(e.x, e.f || '') : '', escHtml(e.o || ''), escHtml(lang.name)];
      const nid = uniq(ankiId('note:', code + '\u0000' + k));
      const sfld = stripHtml(flds[0]);
      insNote.run([nid, noteGuid(code, k), ANKI_MODEL_ID, nowS, -1, ` khwanish lang::${code} `, flds.join('\x1f'), sfld, await sha1Csum(sfld), 0, '']);
      const dirs = [1];
      if (reverse && e.m) dirs.push(2);
      for (const dir of dirs) {
      const c = e.s === 1 ? cardOf(e, dir) : null;
      const cid = uniq(ankiId('card:', code + '\u0000' + k + (dir === 2 ? '\u0000r' : '')));
      let type = 0, queue = 0, due, ivl = 0, factor = 0, left = 0, data = '';
      if (!c || !c.q) { due = ++newPos; }
      else {
        factor = 2500;
        data = JSON.stringify({ s: Math.round(c.S * 1e4) / 1e4, d: Math.round(c.D * 1e4) / 1e4, dr: ret });
        if (c.q === 2) {
          type = 2; queue = 2;
          ivl = c.ivl || Math.max(1, Math.round((c.due - (c.lr || now)) / DAY));
          due = Math.round((dayStart(c.due) - today0) / DAY);
        } else {
          type = c.q === 3 ? 3 : 1; queue = 1;
          due = Math.floor(c.due / 1000);
          const remaining = c.q === 3 ? 1 : Math.max(1, 2 - (c.st || 0));
          left = remaining * 1000 + remaining;
          ivl = c.q === 3 ? Math.max(1, Math.round(c.S)) : 0;
        }
      }
      insCard.run([cid, nid, did, dir - 1, nowS, -1, type, queue, due, ivl, factor, c ? c.rp || 0 : 0, c ? c.lp || 0 : 0, left, 0, 0, 0, data]);
      nCards++;
      for (const r of (c && c.h) || []) {
        const [t, g, ty, iv, liv] = r;
        insRev.run([uniq(t * 1000), cid, -1, g, iv, liv, ty === 1 || ty === 2 ? 2500 : 0, 0, ty]);
        nReviews++;
      }
      }
    }
    insNote.free(); insCard.free(); insRev.free();
    db.run('COMMIT');

    const conf = { activeDecks: [firstDeck], curDeck: firstDeck, newSpread: 0, collapseTime: 1200, timeLim: 0, estTimes: true,
      dueCounts: true, curModel: String(ANKI_MODEL_ID), nextPos: newPos + 1, sortType: 'noteFld', sortBackwards: false, addToCur: true, schedVer: 2 };
    db.run('INSERT INTO col VALUES (1,?,?,?,11,0,0,0,?,?,?,?,?)', [
      Math.floor(today0 / 1000), now, now, JSON.stringify(conf),
      JSON.stringify({ [ANKI_MODEL_ID]: ankiModel(nowS, firstDeck) }), JSON.stringify(decks), JSON.stringify(ANKI_DCONF), '{}']);
    const bytes = db.export();
    const blob = zipStore([{ name: 'collection.anki2', data: bytes }, { name: 'media', data: enc.encode('{}') }]);
    return { blob, cards: nCards, reviews: nReviews };
  } finally { db.close(); }
}

/* ---------- review ---------- */
// A word's two cards are kept apart: once one was studied today, the other waits for another day.
function pickNext(scope, avoid) {
  const now = Date.now(), day0 = dayStart(now);

      if (e.d || e.s !== 1) continue;
      if (avoid && avoid.code === c && avoid.key === k) continue;

function answer(g) {

  const wasNew = !cur.q;
  R.undo = { it, prev: JSON.parse(JSON.stringify(e)), wasNew };
  const next = FSRS.answer(cur, g, Date.now(), { ret: S.settings.retention, maxIvl: S.settings.maxIvl, fuzz: true });
  putEntry(it.code, it.key, it.d === 2 ? { c2: next } : { c: next });
  bumpStat('r');

}
function undoReview() {

}

}
function reviewKey(e) {
  const R = UI.review;
  if (!R || UI.sheet) return;
  const k = e.key;
  if (k === 'u' || k === 'U') { undoReview(); e.preventDefault(); return; }
  if (!R.cur) return;
  if (k === ' ' || k === 'Enter') { if (!R.shown) { R.shown = true; drawReview(); } else answer(3); e.preventDefault(); }

function drawList() {

/* ---------- Anki export ---------- */
const escHtml = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function markHtml(sentence, form) {
  const i = form ? sentence.indexOf(form) : -1;
  if (i < 0) return escHtml(sentence);
  return escHtml(sentence.slice(0, i)) + '<b>' + escHtml(form) + '</b>' + escHtml(sentence.slice(i + form.length));
}
function exportRows(st) {
  const rows = [];
  for (const code of scopeCodes(st.scope)) {
    for (const [k, e] of vmap(code)) {
      if (e.d) continue;
      if (st.which === 'cards' && !((e.c || e.c2) && e.s === 1)) continue;
      if (st.which === 'learning' && e.s !== 1) continue;
      if (st.which === 'meaning' && !e.m) continue;
      if (st.onlyNew && e.ex) continue;
      rows.push([code, k, e]);
    }
  }
  return rows;
}
function buildAnki(rows, st, deck) {
  const q = s => '"' + String(s == null ? '' : s).replace(/"/g, '""').replace(/\r?\n/g, '<br>').replace(/\t/g, ' ') + '"';
  const guid = noteGuid;
  const lines = ['#separator:tab', '#html:true'];
  if (st.fmt === 'basic') lines.push(st.rev ? '#notetype:Basic (and reversed card)' : '#notetype:Basic');
  if (deck) lines.push('#deck:' + deck.replace(/[\t\n]/g, ' '));
  if (st.fmt === 'basic') { lines.push('#guid column:1', '#tags column:4', '#columns:GUID\tFront\tBack\tTags'); }
  else { lines.push('#guid column:1', '#tags column:9', '#columns:GUID\tTerm\tMeaning\tRoot\tNotes\tSentence\tSource\tLanguage\tTags'); }
  for (const [code, k, e] of rows) {
    const lang = langOrStub(code);
    const form = e.f || k;
    const tags = `khwanish lang::${code}`;
    if (st.fmt === 'basic') {
      let front = `<div dir="auto" lang="${escHtml(code)}" style="font-size:1.7em">${escHtml(form)}</div>`;
      const sentHtml = e.x ? `<div dir="auto" lang="${escHtml(code)}" style="font-size:0.95em;opacity:.8;margin-top:.6em">${markHtml(e.x, e.f || '')}</div>` : '';
      if (st.sent) front += sentHtml;
      let back = `<div dir="auto" style="font-size:1.3em">${escHtml(e.m || '')}</div>`;
      if (e.r) back += `<div dir="auto" style="opacity:.75;margin-top:.4em">from <span lang="${escHtml(code)}">${escHtml(e.r)}</span></div>`;
      if (e.n) back += `<div dir="auto" style="margin-top:.4em">${escHtml(e.n)}</div>`;
      if (!st.sent && sentHtml) back += sentHtml;
      if (e.o) back += `<div dir="auto" style="opacity:.6;font-size:.8em;margin-top:.6em">${escHtml(e.o)}</div>`;
      lines.push([q(guid(code, k)), q(front), q(back), q(tags)].join('\t'));
    } else {
      lines.push([guid(code, k), escHtml(form), escHtml(e.m || ''), escHtml(e.r || ''), escHtml(e.n || ''), e.x ? markHtml(e.x, e.f || '') : '', escHtml(e.o || ''), escHtml(lang.name), tags].map(q).join('\t'));
    }
  }
  return lines.join('\n') + '\n';
}

    field('wi-text', 'Words', ta),
    field('wi-file', 'Or choose a file', file),

      [['known', 'Known'], ['learning', 'Learning']].map(([v, l]) => h('div', { class: 'radio' },
        h('input', { type: 'radio', name: 'wi-as', id: 'wi-as-' + v, checked: st.as === v, onchange: () => { st.as = v; } }),
        h('label', { for: 'wi-as-' + v }, l)))),

    err,
    h('div', { class: 'm-actions' }, h('button', { class: 'btn primary', type: 'button', onclick: async () => {
      await ensureLang(code);
      const kf = keyFn(lang);
      let n = 0, skipped = 0;
      for (const raw of ta.value.split(/\r?\n/)) {
        const line = raw.trim();
        if (!line) continue;
        const cut = line.indexOf('\t');
        const word = (cut >= 0 ? line.slice(0, cut) : line).trim();
        const meaning = cut >= 0 ? line.slice(cut + 1).replace(/\t/g, ' ').trim() : '';
        if (!word) continue;
        const multi = /\s/.test(word);
        const k = multi ? phraseKey(lang, word) : kf(word);
        if (!k) continue;
        const e = entry(code, k);
        if (st.as === 'known') {
          if (e && e.s === 1) { skipped++; continue; }
          putEntry(code, k, { s: 2, ...(meaning ? { m: meaning, f: word } : {}), ...(multi ? { p: 1, f: word } : {}) });

async function boot(hot) {
  await Local.open();

  S.settings = fixSettings(st);
  S.stats = stats && stats.days ? stats : { days: {}, u: 0 };
  for (const m of lessons || []) if (m && m.id) S.lessons.set(m.id, m);
  S.meta = meta || {};
  Sync.restore(pending);
  await ensureLangLocal(S.settings.cur);
  UI.init();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if (hot && hot.l && S.lessons.get(hot.l) && !S.lessons.get(hot.l).del) openLesson(hot.l, hot.p);
  else route();
  connectExtras();
  cloudSync();
  acctBoot();
}
function start(hot) {

}

/* ---------- accounts: the website copy, when its site has a Supabase project ---------- */
// Signing in is optional. An account keeps texts, word lists and OCR models online, each one private,
// unlisted (anyone with the link) or public (in the shared library once the team approves it).
// Reading progress and flashcards stay in this browser either way. The rules that enforce all this
// live in the database (supabase/schema.sql); this file is only the interface to them.
const ACCT = SITE && SITE.supabase && SITE.supabase.url && SITE.supabase.key ? SITE.supabase : null;
const SUPABASE_CDN = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js';
const Acct = { client: null, loading: null, user: null, profile: null, team: false };
const KIND_NAME = { text: 'Text', wordlist: 'Word list', ocr_model: 'OCR model' };
const LICENSES = ['Public domain', 'CC0 1.0', 'CC BY 4.0', 'CC BY-SA 4.0', 'Used with permission'];
const LIST_COLS = 'id,owner,kind,lang,lang_name,title,description,source,license,visibility,review,review_note,word_count,file_name,file_size,updated_at';
const RID = /^r-([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$/i;
const MAX_TEXT = 1000000, MAX_WORDS = 20000, MAX_MODEL = 50 * 1048576;

function acctClient() {
  if (!ACCT) return Promise.reject(new Error('Accounts aren’t set up for this copy of the reader.'));
  if (Acct.client) return Promise.resolve(Acct.client);
  if (Acct.loading) return Acct.loading;
  Acct.loading = (async () => {
    if (!(window.supabase && window.supabase.createClient)) {
      for (const url of [SITE.lib + 'supabase/supabase.js', SUPABASE_CDN]) {
        try { await loadScript(url); break; } catch { /* try the next copy */ }
      }
    }
    if (!(window.supabase && window.supabase.createClient)) throw new Error('Couldn’t load the sign-in service. Check your connection and try again.');
    const c = window.supabase.createClient(ACCT.url, ACCT.key, {
      auth: { flowType: 'pkce', storageKey: 'khwanish-auth', persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
    });
    // the callback mustn't wait on other calls to the client, so it hands over and returns
    c.auth.onAuthStateChange((_event, session) => { setTimeout(() => acctSession(session), 0); });
    const { data } = await c.auth.getSession(); // also finishes a sign-in coming back from Google
    Acct.client = c;
    await acctSession(data.session);
    acctReturn();
    return c;
  })();
  Acct.loading.catch(() => { Acct.loading = null; });
  return Acct.loading;
}
// Back from Google: tidy the address and go where the person was heading.
function acctReturn() {
  if (!/[?&](code|error)=/.test(location.search)) return;
  const err = new URLSearchParams(location.search).get('error_description');
  history.replaceState(null, '', location.pathname + location.hash);
  let after = '';
  try { after = sessionStorage.getItem('khwanish-after') || ''; sessionStorage.removeItem('khwanish-after'); } catch { /* storage off */ }
  if (err) toast('Sign-in didn’t finish: ' + err);
  else if (Acct.user) { toast('Signed in'); if (after) go(after); }
}
async function acctSession(session) {
  const user = (session && session.user) || null;
  const changed = (user && user.id) !== (Acct.user && Acct.user.id);
  Acct.user = user;
  if (!user) { Acct.profile = null; Acct.team = false; }
  else if (changed || !Acct.profile) {
    const { data } = await Acct.client.from('profiles').select('display_name, is_moderator').eq('id', user.id).maybeSingle();
    Acct.profile = data || { display_name: '', is_moderator: false };
    Acct.team = !!Acct.profile.is_moderator;
  }
  if (changed && ['account', 'shared', 'resource', 'options'].includes(UI.route)) route();
}
// Start the service only when it's needed: a saved sign-in, a return from Google, or a shared link.
function acctBoot() {
  if (!ACCT) return;
  let saved = false;
  try { saved = !!localStorage.getItem('khwanish-auth'); } catch { /* storage off */ }
  if (saved || /[?&](code|error)=/.test(location.search)) acctClient().catch(e => toast(acctErr(e)));
}
async function acctSignIn(after) {
  try {
    const c = await acctClient();
    try { sessionStorage.setItem('khwanish-after', after || 'account'); } catch { /* storage off */ }
    const { error } = await c.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname } });
    if (error) throw error;
  } catch (e) { toast(acctErr(e)); }
}
async function acctSignOut() {
  try { await Acct.client.auth.signOut(); } catch { /* signed out here either way */ }
  await acctSession(null);
  toast('Signed out');
  route();
}
function acctErr(e) {
  const m = (e && (e.message || e.error_description || e.msg)) || String(e);
  if (/failed to fetch|networkerror|load failed/i.test(m)) return 'Couldn’t reach the server. Check your connection and try again.';
  if (/jwt|expired|not authenticated/i.test(m)) return 'Your sign-in has run out. Sign in again.';
  return m;
}
const shareLink = id => location.origin + location.pathname + '#r-' + id;
const langName = (code, fallback) => (L(code) || CATALOG_BY_CODE[code] || {}).name || fallback || code;
function fmtSize(n) { return n >= 1048576 ? `${(n / 1048576).toFixed(1)} MB` : `${Math.max(1, Math.round(n / 1024))} KB`; }
function visText(r) {
  if (r.visibility === 'private') return 'Private';
  if (r.visibility === 'unlisted') return 'Unlisted';
  return { pending: 'Public, waiting for review', rejected: 'Public, not approved' }[r.review] || 'Public';
}
async function copyLink(id) {
  try { await navigator.clipboard.writeText(shareLink(id)); toast('Link copied'); } catch { toast(shareLink(id)); }
}
async function namesFor(ids) {
  const out = {};
  try {
    const { data } = await Acct.client.rpc('display_names', { ids: [...new Set(ids)] });
    for (const p of data || []) out[p.id] = p.display_name;
  } catch { /* names are a nicety */ }
  return out;
}
function resourceRow(r, mine, names) {
  const bits = [KIND_NAME[r.kind], langName(r.lang, r.lang_name)];
  if (r.kind === 'text' && r.word_count) bits.push(`${fmtNum(r.word_count)} words`);
  if (r.kind === 'wordlist') bits.push(`${fmtNum(r.word_count)} words`);
  if (r.kind === 'ocr_model' && r.file_size) bits.push(fmtSize(r.file_size));
  if (mine) bits.push(visText(r));
  else if (names) bits.push(names[r.owner] || 'A Zabanestan member');
  return h('a', { class: 'lesson', href: '#r-' + r.id },
    h('span', { class: 'l-title', dir: 'auto' }, r.title),
    h('span', { class: 'l-meta' }, bits.join(' · ')),
    mine && r.review === 'rejected' && r.review_note ? h('span', { class: 'l-meta warn' }, 'Not approved: ' + r.review_note) : null);
}

async function fillList(box, narrow, mine, empty) {
  try {
    const c = await acctClient();
    const { data, error } = await narrow(c.from('resources').select(LIST_COLS));
    if (error) throw error;
    const names = mine ? null : await namesFor(data.map(r => r.owner));
    if (!box.isConnected) return;
    box.replaceChildren(...(data.length ? data.map(r => resourceRow(r, mine, names)) : [h('p', { class: 'empty' }, empty)]));
  } catch (e) {
    if (box.isConnected) box.replaceChildren(h('p', { class: 'error' }, acctErr(e)));
  }
}
async function acctDelete() {
  if (!await confirmBox('Delete your account', 'This deletes your account and everything kept in it, including links you’ve shared. Your reading and flashcards in this browser stay. It can’t be undone.', 'Delete my account', true)) return;
  try {
    const c = Acct.client;
    const { data: files, error } = await c.from('resources').select('file_path').eq('owner', Acct.user.id).not('file_path', 'is', null);
    if (error) throw error;
    if (files.length) await c.storage.from('ocr-models').remove(files.map(f => f.file_path));
    const { error: e2 } = await c.rpc('delete_my_account');
    if (e2) throw e2;
    try { await c.auth.signOut({ scope: 'local' }); } catch { /* already gone */ }
    await acctSession(null);
    toast('Your account is deleted');
    go('library');
  } catch (e) { toast(acctErr(e)); }
}

    ocr_model: ['Download the model', () => downloadModel(r)],
  }[r.kind];
  v.replaceChildren(...nodes(
    h('h2', { class: 'r-title', dir: 'auto' }, r.title),
    r.description ? h('p', { dir: 'auto' }, r.description) : null,
    h('dl', { class: 'facts' }, facts.map(([k, x]) => [h('dt', null, k), h('dd', { dir: 'auto' }, x)])),
    mine && r.review === 'rejected' && r.review_note ? h('p', { class: 'notice' }, 'The team didn’t approve this for the library: ' + r.review_note) : null,
    h('div', { class: 'actions' },
      h('button', { class: 'btn primary', type: 'button', onclick: use[1] }, use[0]),
      r.visibility !== 'private' ? h('button', { class: 'btn', type: 'button', onclick: () => copyLink(r.id) }, 'Copy link') : null,
      mine ? h('button', { class: 'btn', type: 'button', onclick: () => openShare({ existing: r }) }, 'Edit') : null,
      mine ? h('button', { class: 'btn danger', type: 'button', onclick: () => removeResource(r) }, 'Delete') : null),
    Acct.team && !mine && r.visibility === 'public' ? h('section', { class: 'opt' },
      h('h2', { class: 'sec' }, 'Review'),
      h('p', { class: 'muted sm' }, r.review === 'approved' ? 'Approved: it’s in the shared library.' : r.review === 'rejected' ? 'Not approved.' : 'Waiting for review. Check that it’s ours to share: the source, the license, and that nothing in it could put anyone at risk.'),
      h('div', { class: 'actions' },
        r.review !== 'approved' ? h('button', { class: 'btn primary', type: 'button', onclick: () => review(r, 'approved') }, 'Approve') : null,
        r.review !== 'rejected' ? h('button', { class: 'btn', type: 'button', onclick: () => rejectWithNote(r) }, 'Don’t approve') : null,
        h('button', { class: 'btn danger', type: 'button', onclick: () => removeResource(r, true) }, 'Take down'))) : null,
    preview));
}
async function review(r, verdict, note = '') {
  const { error } = await Acct.client.from('resources').update({ review: verdict, review_note: note }).eq('id', r.id);
  if (error) { toast(acctErr(error)); return; }
  toast(verdict === 'approved' ? 'Approved: it’s in the shared library now' : 'Marked as not approved');
  route();
}
function rejectWithNote(r) {
  const note = h('textarea', { class: 'input', rows: 3, maxlength: 1000, placeholder: 'For example: please add the edition and year.' });
  openModal('Don’t approve', [
    field('rv-note', 'A note for the person who shared it', note, 'They see it beside the resource and can fix it and share again.'),
    h('div', { class: 'm-actions' }, h('button', { class: 'btn primary', type: 'button', onclick: () => { closeModal(); review(r, 'rejected', note.value.trim()); } }, 'Send')),
  ]);
}
async function removeResource(r, takedown) {
  const msg = takedown ? `Take down “${r.title}”? It’s deleted for everyone, including the person who shared it.` : `Delete “${r.title}”? Links to it will stop working. Copies people already added to their reader stay with them.`;
  if (!await confirmBox(takedown ? 'Take down' : 'Delete', msg, takedown ? 'Take down' : 'Delete', true)) return;
  const c = Acct.client;
  const { error } = await c.from('resources').delete().eq('id', r.id);
  if (error) { toast(acctErr(error)); return; }
  if (r.file_path) await c.storage.from('ocr-models').remove([r.file_path]);
  toast(takedown ? 'Taken down' : 'Deleted');
  go(takedown ? 'shared' : 'account');
}

/* using what's shared */
function useLang(code, name) {
  if (!L(code)) addLang(CATALOG_BY_CODE[code] || { code, name: name || code });
}
async function addSharedText(r) {
  useLang(r.lang, r.lang_name);
  const have = [...S.lessons.values()].find(m => !m.del && m.src === 'shared:' + r.id);
  if (have) { toast('It’s already in your library'); openLesson(have.id); return; }
  const m = await createLesson(r.lang, r.title, r.content.text, 'shared:' + r.id);
  toast('Added to your library');
  openLesson(m.id);
}
async function addSharedWords(r) {
  useLang(r.lang, r.lang_name);
  if (S.settings.cur !== r.lang) await switchLang(r.lang);
  openWordImport(r.content.words.map(([w, m]) => m ? `${w}\t${m}` : w).join('\n'), { as: 'learning' });
}
async function downloadModel(r) {
  try {
    toast('Downloading…');
    const { data, error } = await Acct.client.storage.from('ocr-models').download(r.file_path);
    if (error) throw error;
    await BrowserFiles.save({ filename: r.file_name || 'model.safetensors', data });
  } catch (e) { toast(acctErr(e)); }
}

/* sharing: a text, a word list or an OCR model, or editing one already shared */
function openShare(o) {
  if (!Acct.user) {
    openModal('Share', [
      h('p', { class: 'm-text' }, 'Sign in to keep this in your account and choose who can see it. After signing in, open Share again.'),
      h('div', { class: 'm-actions' }, h('button', { class: 'btn primary', type: 'button', onclick: () => acctSignIn(UI.route === 'resource' ? 'r-' + UI.resourceId : UI.route) }, 'Sign in with Google')),
    ]);
    return;
  }
  const ex = o.existing || null;
  const kind = ex ? ex.kind : o.kind;
  const st = { vis: ex ? ex.visibility : 'private', rights: ex ? true : false };
  const title = h('input', { class: 'input', value: ex ? ex.title : (o.title || ''), maxlength: 200, dir: 'auto' });
  const desc = h('textarea', { class: 'input', rows: 2, maxlength: 2000, dir: 'auto' });
  desc.value = ex ? ex.description : '';
  const source = h('input', { class: 'input', value: ex ? ex.source : '', maxlength: 1000, dir: 'auto',
    placeholder: kind === 'ocr_model' ? 'What it was trained on, and the base model' : 'Author, title, edition and year, or “my own work”' });
  const lic = ex && ex.license && !LICENSES.includes(ex.license) ? ex.license : '';
  const license = selectEl([['', 'Choose a license'], ...LICENSES.map(x => [x, x]), ['other', 'Another license']], ex ? (lic ? 'other' : ex.license) : '');
  const other = h('input', { class: 'input', value: lic, maxlength: 100, placeholder: 'Name of the license' });
  const otherField = field('sh-lic-other', 'License name', other);
  const syncOther = () => { otherField.hidden = license.value !== 'other'; };
  license.addEventListener('change', syncOther);
  syncOther();
  const file = kind === 'ocr_model' && !ex ? h('input', { type: 'file', class: 'input', accept: '.mlmodel,.safetensors,.pt,.ckpt' }) : null;
  const langPick = kind === 'ocr_model' && !ex ? langSelect('sh-lang') : null;
  const rightsRow = checkRow('sh-rights', 'I have the right to share this under the license above', st.rights, x => { st.rights = x; });
  const radios = h('fieldset', { class: 'radios' }, h('legend', null, 'Who can open it'),
    [['private', 'Only me'], ['unlisted', 'Anyone with the link'], ['public', 'Everyone: list it in the shared library after the team checks it']].map(([v, l]) => h('div', { class: 'radio' },
      h('input', { type: 'radio', name: 'sh-vis', id: 'sh-vis-' + v, checked: st.vis === v, onchange: () => { st.vis = v; sync(); } }),
      h('label', { for: 'sh-vis-' + v }, l))));
  const sync = () => { rightsRow.hidden = st.vis === 'private'; };
  sync();
  const err = h('p', { class: 'error', role: 'alert' });
  const go_ = h('button', { class: 'btn primary', type: 'button' }, ex ? 'Save' : 'Share');
  go_.onclick = async () => {
    err.textContent = '';
    const licenseName = license.value === 'other' ? other.value.trim() : license.value;
    const t = title.value.trim();
    if (!t) { err.textContent = 'Give it a title.'; return; }
    if (st.vis !== 'private' && !licenseName) { err.textContent = 'Choose a license, so people know how they may use it.'; return; }
    if (st.vis !== 'private' && !st.rights) { err.textContent = 'Confirm that you have the right to share it.'; return; }
    if (st.vis === 'public' && !source.value.trim()) { err.textContent = 'Say where it comes from, so the team can check it.'; return; }
    const row = { title: t, description: desc.value.trim(), source: source.value.trim(), license: licenseName, visibility: st.vis, rights_confirmed: st.vis !== 'private' && st.rights };
    go_.disabled = true;
    try {
      const id = ex ? await updateShared(ex, row) : await createShared(kind, o, row, file, langPick);
      closeModal();
      toast(st.vis === 'public' && !Acct.team ? 'Shared. It joins the library once the team has checked it.' : ex ? 'Saved' : 'Shared');
      go('r-' + id); // redraws even when the link is the one already open (after an edit)
    } catch (e) {
      err.textContent = acctErr(e);
      go_.disabled = false;
    }
  };
  openModal(ex ? 'Edit' : { text: 'Share this text', wordlist: 'Share a word list', ocr_model: 'Share an OCR model' }[kind], [
    file ? field('sh-file', 'Model file', file, 'A kraken model (.mlmodel or .safetensors), up to 50 MB.') : null,
    langPick ? field('sh-lang', 'Language it reads', langPick) : null,
    o.pick || null,
    field('sh-title', 'Title', title),
    field('sh-desc', 'Description (optional)', desc),
    field('sh-source', 'Where it comes from', source),
    field('sh-license', 'License', license),
    otherField,
    radios,
    rightsRow,
    h('p', { class: 'hint' }, 'Share only what you have the right to share. The team removes anything that isn’t.'),
    err,
    h('div', { class: 'm-actions' }, go_),
  ], { wide: true });
}
async function createShared(kind, o, row, file, langPick) {
  const c = Acct.client;
  if (kind === 'ocr_model') {
    const f = file && file.files[0];
    if (!f) throw new Error('Choose the model file.');
    if (f.size > MAX_MODEL) throw new Error('Models up to 50 MB can be shared.');
    const ext = (/\.[a-z0-9]{1,12}$/i.exec(f.name) || ['.model'])[0].toLowerCase();
    const path = `${Acct.user.id}/${crypto.randomUUID()}${ext}`;
    const up = await c.storage.from('ocr-models').upload(path, f, { contentType: 'application/octet-stream', upsert: false });
    if (up.error) throw up.error;
    const code = langPick.value;
    const { data, error } = await c.from('resources').insert({ ...row, kind, lang: code, lang_name: langName(code), file_path: path, file_name: f.name.slice(0, 200), file_size: f.size }).select('id').single();
    if (error) { await c.storage.from('ocr-models').remove([path]); throw error; }
    return data.id;
  }
  const content = await o.content();
  const { data, error } = await c.from('resources').insert({ ...row, kind, lang: o.lang, lang_name: langName(o.lang), content: content.body, word_count: content.count }).select('id').single();
  if (error) throw error;
  return data.id;
}
async function updateShared(ex, row) {
  const { data, error } = await Acct.client.from('resources').update(row).eq('id', ex.id).select('id').single();
  if (error) throw error;
  return data.id;
}
// from a text's menu in the Library
function shareLesson(m) {
  openShare({ kind: 'text', lang: m.lang, title: m.title, content: async () => {
    const text = await getText(m.id);
    if (!text) throw new Error('This text isn’t on this device yet. Open it once, then share it.');
    if (text.length > MAX_TEXT) throw new Error('That text is too long to share: the limit is a million characters.');
    return { body: { text }, count: m.words || countWords(text, L(m.lang)) };
  } });
}
// from Words: the words you're learning, or all with meanings
function shareWords() {
  const code = S.settings.cur;
  const st = { which: 'cards' };
  const pick = h('fieldset', { class: 'radios' }, h('legend', null, 'Which words'),
    [['cards', 'Words with flashcards'], ['learning', 'All the words I’m learning'], ['meanings', 'Every saved word that has a meaning']].map(([v, l]) => h('div', { class: 'radio' },
      h('input', { type: 'radio', name: 'sh-which', id: 'sh-which-' + v, checked: st.which === v, onchange: () => { st.which = v; } }),
      h('label', { for: 'sh-which-' + v }, l))));
  openShare({ kind: 'wordlist', lang: code, title: `${L().name} words`, pick, content: async () => {
    await ensureLang(code);
    const words = [];
    for (const [k, e] of vmap(code)) {
      if (e.d) continue;
      const ok = st.which === 'cards' ? (e.c || e.c2) : st.which === 'learning' ? e.s === 1 : !!e.m;
      if (ok) words.push([e.f || k, e.m || '']);
      if (words.length > MAX_WORDS) throw new Error('That’s too many words to share at once: the limit is 20,000.');
    }
    if (!words.length) throw new Error('There are no words like that to share yet.');
    return { body: { words }, count: words.length };
  } });
}
