# Core roster, in priority order. The order in this file is the ranking on the site;
# the site groups languages by endangerment level automatically.
#
# Fields for each language:
#   id             short name used in links, e.g. languages.html#yaghnobi (lowercase, no spaces)
#   name           English name
#   native         name in the language's own script (leave the line out if unsure)
#   native_lang    language code for the native name, which helps screen readers
#   native_script  Arab for right-to-left Arabic script; Cyrl or Latn otherwise
#   level          1 vulnerable, 2 definitely, 3 severely, 4 critically endangered (UNESCO scale)
#   branch, spoken_in, script, iso   the other columns of the table
#   note           optional extra line under the name
#
# Keep text in double quotes. Indent with two spaces, never tabs.

- id: yaghnobi
  name: "Yaghnobi"
  native: "Яғнобӣ зивок"
  native_lang: yai
  native_script: Cyrl
  level: 3
  branch: "Eastern Iranian, Sogdian lineage"
  spoken_in: "Tajikistan (Yaghnob Valley)"
  script: "Cyrillic, Latin, Arabic"
  iso: "yai"

